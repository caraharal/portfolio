<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="慢帧时光 — 胶片相机集市，精选二手胶片相机">
  <title>慢帧时光 film — 胶片相机集市</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=catalog-20260919">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="site-logo">
      <span class="logo-icon">📷</span><span id="site-logo">慢帧时光</span>
    </div>
    <div class="site-subtitle" id="site-subtitle">film camera market</div>
    <hr class="header-divider">
  </header>

  <!-- 主体：左右分栏（桌面端） -->
  <div class="main-layout" id="main-layout">

    <!-- 左侧面板：AI 导购助手 -->
    <aside class="ai-panel" id="ai-panel">
      <div class="ai-panel-header">
        <span>🤖 AI 帮你选</span>
      </div>
      <div class="ai-panel-chat" id="ai-panel-chat">
        <!-- 初始欢迎消息 -->
        <div class="ai-panel-welcome">
          <p>不知道选哪台？</p>
          <p>告诉我你的预算和需求，<br>帮你找到最合适的胶片相机。</p>
          <button class="ai-start-btn" id="ai-start-btn">开始推荐 →</button>
        </div>
      </div>
    </aside>

    <!-- 右侧：相机列表 + 筛选栏 -->
    <div class="camera-area">

      <!-- 品牌筛选栏 -->
      <div class="brand-filter-bar" id="brand-filter-bar">
        <button class="brand-filter-btn active" data-brand="all">全部</button>
        <button class="brand-filter-btn" data-brand="Canon">佳能</button>
        <button class="brand-filter-btn" data-brand="Nikon">尼康</button>
        <button class="brand-filter-btn" data-brand="Pentax">宾得</button>
        <button class="brand-filter-btn" data-brand="Minolta">美能达</button>
        <button class="brand-filter-btn" data-brand="Olympus">奥林巴斯</button>
        <button class="brand-filter-btn" data-brand="Contax">康泰时</button>
        <button class="brand-filter-btn" data-brand="Ricoh">理光</button>
        <button class="brand-filter-btn" data-brand="Fujifilm">富士</button>
      </div>

      <section class="catalog-controls" aria-label="查找相机">
        <label>搜索相机<input id="camera-search" type="search" placeholder="品牌、型号或描述" maxlength="100"></label>
        <label>库存<select id="camera-stock"><option value="all">全部状态</option><option value="available">只看现货</option><option value="restocking">补货中</option><option value="sold">已售出</option></select></label>
        <label>排序<select id="camera-sort"><option value="default">现货优先</option><option value="price-asc">价格从低到高</option><option value="price-desc">价格从高到低</option></select></label>
        <button id="camera-reset" type="button" class="brand-filter-btn">清除筛选</button>
        <p id="camera-count" role="status" aria-live="polite"></p>
      </section>
      <!-- 相机卡片区域 -->
      <main class="camera-list" id="camera-list">
        <div class="empty-state">📷 加载中...</div>
      </main>

    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    购买前请确认成色、功能及售后约定，以具体商品说明和双方沟通为准。
  </footer>

  <!-- 移动端：AI 导购浮动按钮 + 弹窗（保留，桌面端隐藏） -->
  <button class="ai-guide-fab" id="ai-guide-fab" aria-label="AI导购">
    <span class="ai-fab-icon">🤖</span>
    <span class="ai-fab-text">AI 帮你选</span>
  </button>

  <div class="ai-guide-modal" id="ai-guide-modal" aria-hidden="true">
    <div class="ai-guide-overlay"></div>
    <div class="ai-guide-dialog">
      <div class="ai-guide-header">
        <span class="ai-guide-header-icon">🤖</span>
        <span>AI 导购助手</span>
        <button class="ai-guide-close" id="ai-guide-close" aria-label="关闭">&times;</button>
      </div>
      <div class="ai-guide-chat" id="ai-guide-chat"></div>
    </div>
  </div>

  <!-- JS -->
  <script src="js/cameras.js"></script>
  <script src="js/main.js?v=catalog-20260919"></script>
</body>
</html>
